
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | TrustVault</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e3a5f, #2563eb);
        }

        .forgot-card {
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #172554;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .otp-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .otp-button:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 23px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            .forgot-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <div class="forgot-card">

        <div class="logo">🔐</div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            No worries! Enter your username and registered email.
            We'll send you an OTP to reset your password.
        </p>

        <form th:action="@{/forgot-password}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Registered Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your registered email"
                       autocomplete="email"
                       required>
            </div>

            <button type="submit" class="otp-button">
                Send OTP
            </button>
        </form>

        <div class="message"
             th:if="${message}"
             th:text="${message}">
        </div>

        <div class="message"
             th:if="${error}"
             th:text="${error}">
        </div>

        <a th:href="@{/login}" class="back-link">
            ← Back to Login
        </a>

    </div>
</body>
</html>
