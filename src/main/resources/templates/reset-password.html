```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | TrustVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #102a43, #2879a8, #69b7d5);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin: 0 0 8px;
            text-align: center;
            color: #17324d;
        }

        .subtitle {
            margin: 0 0 24px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2879a8;
            box-shadow: 0 0 0 3px rgba(40, 121, 168, 0.12);
        }

        .otp {
            letter-spacing: 5px;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125486;
        }

        .message {
            margin: 14px 0;
            padding: 10px;
            border-radius: 7px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 14px;
        }

        .back {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Verify your OTP and create a new password.</p>

    <p class="message"
       th:if="${message}"
       th:text="${message}"></p>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Username</label>
        <input id="username" type="text" name="username"
               autocomplete="username" required>

        <label for="email">Registered Email</label>
        <input id="email" type="email" name="email"
               autocomplete="email" required>

        <label for="otp">6-digit OTP</label>
        <input id="otp" class="otp" type="text" name="otp"
               inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" placeholder="000000" required>

        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" name="newPassword"
               minlength="8" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password"
               name="confirmPassword" minlength="8"
               autocomplete="new-password" required>

        <button type="submit">Verify OTP & Reset Password</button>
    </form>

    <p class="back">
        Didn't receive an OTP?
        <a th:href="@{/forgot-password}">Request another OTP</a>
    </p>

    <p class="back">
        <a th:href="@{/login}">Back to Login</a>
    </p>
</div>
</body>
</html>
