
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail | TrustVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071426, #123b60);
            color: #17324d;
            min-height: 100vh;
        }

        header {
            padding: 22px 30px;
            color: white;
            background: #071426aa;
            border-bottom: 1px solid #ffffff25;
        }

        header h2 {
            margin: 0;
            font-size: 27px;
        }

        header span {
            color: #65d6ff;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            padding: 28px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 18px 50px #00000030;
            overflow-x: auto;
        }

        h1 {
            margin-top: 0;
        }

        .description {
            color: #64748b;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            color: #17324d;
            background: #f1f5f9;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .action {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 24px;
        }

        .back {
            display: inline-block;
            margin-top: 24px;
            color: #2879a8;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        <h2>Trust<span>Vault</span></h2>
        <p>Document Activity & Audit Trail</p>
    </header>

    <main>
        <section class="card">
            <h1>Audit Trail</h1>

            <p class="description">
                Review document upload and download activity.
            </p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Action</th>
                        <th>Document</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="log : ${logs}">
                        <td th:text="${log.id}"></td>
                        <td th:text="${log.username}"></td>
                        <td>
                            <span class="action"
                                  th:text="${log.action}"></span>
                        </td>
                        <td th:text="${log.documentTitle}"></td>
                        <td th:text="${log.actionTime}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="5" class="empty">
                            No activity recorded yet.
                        </td>
                    </tr>
                </tbody>
            </table>

            <a class="back" th:href="@{/}">
                ← Back to Dashboard
            </a>
        </section>
    </main>
</body>
</html>
