
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #17324d, #2563a6);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
        }

        header {
            background: rgba(8, 20, 40, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 35px;
        }

        header h2 {
            margin: 0 0 8px;
            color: #93c5fd;
        }

        header p {
            margin: 0;
            color: #cbd5e1;
        }

        main {
            max-width: 850px;
            margin: 60px auto;
            padding: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .card h1 {
            color: #ffffff;
            margin-top: 0;
        }

        .card p {
            color: #dbeafe;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 28px;
        }

        .buttons a,
        .buttons button {
            display: inline-block;
            background: #2879a8;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        .buttons a:hover,
        .buttons button:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .buttons .audit {
            background: #16836b;
        }

        .buttons .audit:hover {
            background: #34d399;
        }

        .buttons .logout {
            background: #64748b;
        }

        .buttons .logout:hover {
            background: #cbd5e1;
        }

        .logout-form {
            margin: 0;
            padding: 0;
        }

        @media (max-width: 600px) {
            main {
                margin: 25px auto;
                padding: 15px;
            }

            .card {
                padding: 24px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>TrustVault</h2>
        <p>Secure Document Management System</p>
    </header>

    <main>
        <div class="card">
            <h1>
                Welcome,
                <span th:text="${username}">User</span>!
            </h1>

            <p>Your TrustVault application is running successfully.</p>
            <p>Manage your documents securely from one place.</p>

            <div class="buttons">
                <a th:href="@{/documents}">View Documents</a>

                <a th:href="@{/audit-logs}" class="audit">
                    Audit Trail
                </a>

                <form th:action="@{/logout}"
                      method="post"
                      class="logout-form">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit" class="logout">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
