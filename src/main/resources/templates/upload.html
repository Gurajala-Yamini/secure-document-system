```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Upload Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #17324d, #2563a6);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
        }

        header {
            background: rgba(8, 20, 40, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 35px;
        }

        header h2 {
            margin: 0 0 8px;
            color: #93c5fd;
        }

        header p {
            margin: 0;
            color: #cbd5e1;
        }

        main {
            max-width: 650px;
            margin: 55px auto;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            color: #ffffff;
        }

        .subtitle {
            color: #dbeafe;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
            color: #e2e8f0;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.65);
            color: #ffffff;
        }

        input[type="file"] {
            cursor: pointer;
        }

        input:focus {
            outline: 2px solid #60a5fa;
            border-color: #60a5fa;
        }

        .hint {
            color: #cbd5e1;
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.5;
        }

        button,
        .back-link {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button {
            background: #38bdf8;
            color: #082f49;
            font-weight: bold;
            margin-top: 25px;
        }

        button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .back-link {
            background: #475569;
            color: white;
            margin-top: 25px;
            margin-left: 8px;
        }

        .back-link:hover {
            background: #64748b;
        }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #f87171;
            color: #fecaca;
            padding: 12px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .success {
            background: rgba(22, 163, 74, 0.2);
            border: 1px solid #4ade80;
            color: #bbf7d0;
            padding: 12px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            main {
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            .back-link {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>TrustVault</h2>
        <p>Secure Document Management System</p>
    </header>

    <main>
        <div class="card">
            <h1>Upload Document</h1>

            <p class="subtitle">
                Store your document securely in TrustVault.
            </p>

            <p class="error"
               th:if="${error}"
               th:text="${error}"></p>

            <p class="success"
               th:if="${success}"
               th:text="${success}"></p>

            <form th:action="@{/documents/upload}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <label for="title">Document Title</label>
                <input type="text"
                       id="title"
                       name="title"
                       placeholder="Enter document title"
                       maxlength="150"
                       required>

                <label for="file">Choose File</label>
                <input type="file"
                       id="file"
                       name="file"
                       required>

                <p class="hint">
                    Maximum upload size: 10 MB. Choose the correct file
                    before uploading.
                </p>

                <button type="submit">Upload Securely</button>

                <a th:href="@{/documents}" class="back-link">
                    Back to Documents
                </a>
            </form>
        </div>
    </main>
</body>
</html>
