
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Reset | TrustVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #17324d;
            background: linear-gradient(
                135deg, #0f172a, #173b68, #6941c6
            );
            background-attachment: fixed;
        }

        .card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
        }

        .brand {
            margin-bottom: 8px;
            color: #6941c6;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            color: #17324d;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 20px;
            color: #344b70;
        }

        p {
            margin-bottom: 22px;
            color: #64748b;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #f8fafc;
            color: #17324d;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6941c6;
            box-shadow: 0 0 0 3px rgba(105, 65, 198, 0.15);
            background: #ffffff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #173b68, #6941c6);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 8px 18px rgba(105, 65, 198, 0.3);
        }

        .success, .error {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #5b36ae;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back:hover {
            color: #173b68;
            text-decoration: underline;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="card">

        <div class="brand">Secure Document Platform</div>

        <h1>TrustVault</h1>
        <h2>Admin Password Reset</h2>

        <p>
            Reset a user's password only after verifying their identity.
            Use a strong password to help keep the account secure.
        </p>

        <div class="success"
             th:if="${success}"
             th:text="${success}"></div>

        <div class="error"
             th:if="${error}"
             th:text="${error}"></div>

        <form th:action="@{/admin/password-reset}" method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="username">Username</label>
            <input id="username"
                   name="username"
                   type="text"
                   required
                   autocomplete="username"
                   placeholder="Enter username">

            <label for="newPassword">New password</label>
            <input id="newPassword"
                   name="newPassword"
                   type="password"
                   minlength="8"
                   required
                   autocomplete="new-password"
                   placeholder="Enter new password">

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword"
                   name="confirmPassword"
                   type="password"
                   minlength="8"
                   required
                   autocomplete="new-password"
                   placeholder="Confirm new password">

            <button type="submit">Reset Password</button>

        </form>

        <a class="back" th:href="@{/}">
            &#8592; Back to TrustVault
        </a>

        <div class="footer">
            Protected access · TrustVault
        </div>

    </main>
</body>
</html>
